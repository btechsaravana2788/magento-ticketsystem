<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Create support ticket form preview</title>
  <desc id="desc">Static mockup of a Magento customer account form for creating a support ticket.</desc>
  <rect width="1440" height="900" fill="#f4f5f7"/>
  <rect width="1440" height="76" fill="#ffffff"/>
  <path d="M0 75.5H1440" stroke="#d8dce2"/>
  <text x="76" y="48" fill="#24282d" font-family="Arial,sans-serif" font-size="24" font-weight="700">YOUR STORE</text>
  <text x="1010" y="46" fill="#555d66" font-family="Arial,sans-serif" font-size="15">Welcome, Alex Morgan</text>
  <text x="1283" y="46" fill="#555d66" font-family="Arial,sans-serif" font-size="15">My Account</text>
  <text x="82" y="133" fill="#6b737d" font-family="Arial,sans-serif" font-size="14">Home  /  My Account  /  Support Tickets  /  Create</text>
  <text x="82" y="193" fill="#24282d" font-family="Arial,sans-serif" font-size="34" font-weight="700">My Account</text>
  <rect x="82" y="225" width="278" height="590" rx="5" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="110" y="273" fill="#252a30" font-family="Arial,sans-serif" font-size="17" font-weight="700">MY ACCOUNT</text>
  <text x="110" y="326" fill="#5d6570" font-family="Arial,sans-serif" font-size="16">Account Dashboard</text>
  <text x="110" y="374" fill="#5d6570" font-family="Arial,sans-serif" font-size="16">Account Information</text>
  <text x="110" y="422" fill="#5d6570" font-family="Arial,sans-serif" font-size="16">Address Book</text>
  <text x="110" y="470" fill="#5d6570" font-family="Arial,sans-serif" font-size="16">My Orders</text>
  <rect x="96" y="490" width="250" height="48" rx="4" fill="#f2f7fb"/>
  <rect x="96" y="490" width="4" height="48" rx="2" fill="#1979c3"/>
  <text x="110" y="520" fill="#1979c3" font-family="Arial,sans-serif" font-size="16" font-weight="700">Support Tickets</text>
  <rect x="390" y="225" width="970" height="590" rx="5" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="430" y="280" fill="#252a30" font-family="Arial,sans-serif" font-size="26" font-weight="700">Create Support Ticket</text>
  <text x="430" y="312" fill="#737b84" font-family="Arial,sans-serif" font-size="15">Tell us how we can help. Our support team will follow up here.</text>
  <path d="M430 345H1320" stroke="#e3e6e9"/>
  <text x="430" y="391" fill="#383f46" font-family="Arial,sans-serif" font-size="15" font-weight="700">Subject <tspan fill="#c0392b">*</tspan></text>
  <rect x="430" y="405" width="830" height="48" rx="3" fill="#ffffff" stroke="#bfc5cc"/>
  <text x="449" y="435" fill="#858d96" font-family="Arial,sans-serif" font-size="15">Example: I need help with my recent order</text>
  <text x="430" y="493" fill="#383f46" font-family="Arial,sans-serif" font-size="15" font-weight="700">Description <tspan fill="#c0392b">*</tspan></text>
  <rect x="430" y="507" width="830" height="174" rx="3" fill="#ffffff" stroke="#bfc5cc"/>
  <text x="449" y="539" fill="#858d96" font-family="Arial,sans-serif" font-size="15">Include details that will help us resolve your request...</text>
  <rect x="430" y="714" width="154" height="48" rx="4" fill="#1979c3"/>
  <text x="462" y="744" fill="#ffffff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Save Ticket</text>
  <text x="612" y="744" fill="#1979c3" font-family="Arial,sans-serif" font-size="15">Back to Tickets</text>
  <text x="82" y="862" fill="#8b929a" font-family="Arial,sans-serif" font-size="13">STATIC UI PREVIEW · NOT CAPTURED FROM A RUNNING MAGENTO STORE</text>
